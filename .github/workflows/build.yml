name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Auto-Find and Build APK
      run: |
        # Cari file gradlew secara otomatis di seluruh folder
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "File gradlew tidak ditemukan!"
          exit 1
        fi
        GRADLEW_DIR=$(dirname "$GRADLEW_PATH")
        echo "Menemukan gradlew di: $GRADLEW_DIR"
        cd "$GRADLEW_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Streamcanvas-APK
        path: '**/app/build/outputs/apk/debug/app-debug.apk'
